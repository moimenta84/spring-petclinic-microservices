# Compose optimizado para VPS con 4 GB RAM / 1 CPU
# Fase 1: solo servicios core (~2.5 GB)
# Para levantar: docker compose -f docker-compose.vps.yml up -d

services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: vc-config-server
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx200m -Xms64m
      # Lee la config desde TU fork (incluye el fix de eureka prefer-ip-address)
      # en vez del repo de upstream. Backend git: el VPS no necesita ficheros locales.
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/moimenta84/spring-petclinic-microservices-config
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL=fix/eureka-prefer-ip-address
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - 8888:8888
    restart: unless-stopped

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: vc-discovery-server
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx200m -Xms64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - 8762:8761
    restart: unless-stopped

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: vc-customers
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx240m -Xms64m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8091:8081
    restart: unless-stopped

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: vc-visits
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx240m -Xms64m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8092:8082
    restart: unless-stopped

  vets-service:
    image: springcommunity/spring-petclinic-vets-service
    container_name: vc-vets
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx240m -Xms64m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8093:8083
    restart: unless-stopped

  api-gateway:
    image: moimeta/spring-petclinic-api-gateway:latest
    container_name: vc-api-gateway
    deploy:
      resources:
        limits:
          memory: 300M
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx200m -Xms64m -XX:MaxMetaspaceSize=100m -XX:ReservedCodeCacheSize=64m
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8090:8080
    restart: unless-stopped

